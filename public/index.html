    function MayaApp() {
      // Global State
      const [viewMode, setViewMode] = useState('assistant'); // 'assistant' | 'client'
      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('maya_accounts');
        return saved ? JSON.parse(saved) : DEFAULT_ACCOUNTS;
      });
      const [activeAccount, setActiveAccount] = useState(accounts[0]);
      const [emails, setEmails] = useState(() => {
        const saved = localStorage.getItem('maya_emails');
        return saved ? JSON.parse(saved) : INITIAL_EMAILS;
      });

      // Filter & Navigation State
      const [activeTab, setActiveTab] = useState('assistant_reply'); // 'all' | 'assistant_reply' | 'client_reply' | 'action_required' | 'waiting' | 'meetings' | 'no_reply' | 'starred' | 'archived'
      const [searchQuery, setSearchQuery] = useState('');
      const [priorityFilter, setPriorityFilter] = useState('all');
      const [selectedThreadId, setSelectedThreadId] = useState(INITIAL_EMAILS[0].threadId);

      // Modals & Drawers
      const [showOnboarding, setShowOnboarding] = useState(false);
      const [showSimulator, setShowSimulator] = useState(false);
      const [showAICopilot, setShowAICopilot] = useState(false);
      const [toast, setToast] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);

      // Sync state to LocalStorage
      useEffect(() => {
        localStorage.setItem('maya_emails', JSON.stringify(emails));
      }, [emails]);

      useEffect(() => {
        localStorage.setItem('maya_accounts', JSON.stringify(accounts));
      }, [accounts]);

      const showToastMessage = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Trigger realistic Mailbox Sync
      const handleSync = () => {
        setIsSyncing(true);
        setTimeout(() => {
          setIsSyncing(false);
          setAccounts(prev => prev.map(a => a.id === activeAccount.id ? { ...a, lastSynced: 'Just now' } : a));
          showToastMessage(`Mailbox ${activeAccount.email} synchronized. All 8 threads verified with AI engine.`);
        }, 800);
      };

      // Reset Demo Data
      const handleResetDemo = () => {
        setEmails(INITIAL_EMAILS);
        setAccounts(DEFAULT_ACCOUNTS);
        setActiveAccount(DEFAULT_ACCOUNTS[0]);
        setSelectedThreadId(INITIAL_EMAILS[0].threadId);
        showToastMessage('Demo dataset restored to initial state.');
      };

      // Computed Metrics
      const stats = useMemo(() => {
        const current = emails.filter(e => e.clientAccount === activeAccount.email);
        return {
          total: current.length,
          unread: current.filter(e => !e.isRead && !e.isArchived).length,
          assistantToReply: current.filter(e => e.classification === 'Assistant to Reply' && !e.isCompleted && !e.isArchived).length,
          clientToReply: current.filter(e => e.classification === 'Client to Reply' && !e.isCompleted && !e.isArchived).length,
          actionRequired: current.filter(e => e.actionRequired && !e.isCompleted && !e.isArchived).length,
          waitingForResponse: current.filter(e => e.waitingForResponse && !e.isArchived).length,
          meetingsCount: current.filter(e => e.detectedMeeting && e.detectedMeeting.hasMeeting && !e.isArchived).length,
          noReplyNeeded: current.filter(e => e.classification === 'No Reply Needed' && !e.isArchived).length
        };
      }, [emails, activeAccount]);

      // Filtered Emails
      const filteredEmails = useMemo(() => {
        return emails.filter(email => {
          if (email.clientAccount !== activeAccount.email) return false;

          // Tab Filter
          if (activeTab === 'assistant_reply' && (email.classification !== 'Assistant to Reply' || email.isCompleted || email.isArchived)) return false;
          if (activeTab === 'client_reply' && (email.classification !== 'Client to Reply' || email.isCompleted || email.isArchived)) return false;
          if (activeTab === 'action_required' && (!email.actionRequired || email.isCompleted || email.isArchived)) return false;
          if (activeTab === 'waiting' && (!email.waitingForResponse || email.isArchived)) return false;
          if (activeTab === 'meetings' && (!email.detectedMeeting?.hasMeeting || email.isArchived)) return false;
          if (activeTab === 'no_reply' && (email.classification !== 'No Reply Needed' || email.isArchived)) return false;
          if (activeTab === 'starred' && (!email.isImportant || email.isArchived)) return false;
          if (activeTab === 'archived' && !email.isArchived) return false;
          if (activeTab === 'all' && email.isArchived) return false;

          // Priority Filter
          if (priorityFilter !== 'all' && email.priority !== priorityFilter) return false;

          // Search Query
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchesSubject = email.subject.toLowerCase().includes(q);
            const matchesSender = email.sender.name.toLowerCase().includes(q) || email.sender.email.toLowerCase().includes(q);
            const matchesSummary = email.summary.toLowerCase().includes(q);
            if (!matchesSubject && !matchesSender && !matchesSummary) return false;
          }

          return true;
        });

        return emails.find(e => e.threadId === selectedThreadId) || filteredEmails[0] || emails[0];

      const handleOverrideClassification = (threadId, newClass) => {
        setEmails(prev => prev.map(e => {
          if (e.threadId === threadId) {
            return {
              ...e,
              classification: newClass,
              isOverridden: true,
              overrideReason: `Manually changed by Assistant to ${newClass}`,
              updatedAt: new Date().toISOString()

          return e;
        }));
        showToastMessage(`Updated classification to "${newClass}"`);

        setEmails(prev => prev.map(e => e.threadId === threadId ? { ...e, isImportant: !e.isImportant } : e));
      };

      const handleToggleRead = (threadId) => {
        setEmails(prev => prev.map(e => e.threadId === threadId ? { ...e, isRead: !e.isRead } : e));
      };

        setEmails(prev => prev.map(e => e.threadId === threadId ? { ...e, isArchived: !e.isArchived } : e));

            const newMsg = {
              id: `msg-${Date.now()}`,
              sender: 'Alex (Executive Assistant)',

              timestamp: 'Just now',
              body: replyText,

              isFromAssistant: true

              messages: [...e.messages, newMsg],
              classification: 'No Reply Needed',
              waitingForResponse: true,
              actionRequired: false,

            return {
              ...e,
              classification: 'Assistant to Reply',

              isOverridden: true,

          return e;
        }));
        showToastMessage('Delegated to assistant Alex with your instructions.');
      };

      // Inbound Simulator Generator
      const handleSimulateInbound = (scenario) => {
        const scenarios = {
          client_urgent: {
            subject: 'Emergency Board Resolution: Liquidity Facility Sign-off ($15M)',

          priority: chosen.priority,
          isImportant: chosen.priority === 'high',
          isRead: false,

          actionRequired: chosen.classification !== 'No Reply Needed',

          actionItems: chosen.classification === 'Assistant to Reply' 
            ? [{ task: 'Coordinate requested meeting time', assignee: 'Assistant', completed: false }]
            : [{ task: 'Review and provide decision', assignee: 'Client', completed: false }],
          detectedMeeting: chosen.category === 'Scheduling' 
            ? { hasMeeting: true, title: chosen.subject, date: 'Next Monday or Tuesday', time: 'Afternoon (45 mins)', location: 'Zoom / Figma' } 
            : { hasMeeting: false },
          clientStatus: { viewedByClient: false, clientActionTaken: 'none', clientNotes: '' },
          draftReply: {
            hasDraft: chosen.classification === 'Assistant to Reply',
            text: chosen.classification === 'Assistant to Reply' ? `Hi Derek,\n\nAlex here for Sarah. Happy to reschedule! Monday at 2:00 PM EST or Tuesday at 3:30 PM EST are open.\n\nBest,\nAlex` : '',
            tone: 'scheduling'

          updatedAt: new Date().toISOString()

    // ==========================================
    // 6. CONVERSATION DETAIL & AI INTELLIGENCE PANE
    // ==========================================
    function ConversationDetail({
      thread,
      onOverrideClassification,
      onToggleStar,
      onToggleRead,
      onArchive,
      onSendReply
    }) {
      const [replyDraftText, setReplyDraftText] = useState(thread.draftReply?.text || '');
      const [activeTone, setActiveTone] = useState(thread.draftReply?.tone || 'professional');
      const [showToneDropdown, setShowToneDropdown] = useState(false);
      const [showClassDropdown, setShowClassDropdown] = useState(false);

      useEffect(() => {
        setReplyDraftText(thread.draftReply?.text || '');
        setActiveTone(thread.draftReply?.tone || 'professional');
      }, [thread]);

      // Handle tone switch
      const handleToneChange = (tone) => {
        setActiveTone(tone);
        setShowToneDropdown(false);
        const sender = thread.sender.name.split(' ')[0];
        const clientName = thread.clientName || 'Sarah';
        
        let sample = '';
        if (tone === 'scheduling') {
          sample = `Hi ${sender},\n\nI manage Sarah's calendar. She would love to connect! Here are a couple of 30-min options next week:\n\n• Tuesday at 2:00 PM EST\n• Wednesday at 11:30 AM EST\n\nPlease let me know if either works and I will send a calendar invite.\n\nBest,\nAlex (EA to Sarah)`;
        } else if (tone === 'direct') {
          sample = `Hi ${sender},\n\nThanks for sending this over. We reviewed the details and agree with the proposed direction. We will follow up with formal confirmation shortly.\n\nBest,\n${clientName}`;
        } else if (tone === 'warm') {
          sample = `Hi ${sender},\n\nGreat hearing from you! Really excited about this initiative. Let's touch base soon to finalize everything.\n\nWarmly,\n${clientName}`;
        } else if (tone === 'decline') {
          sample = `Hi ${sender},\n\nThank you for reaching out. Unfortunately, due to full bandwidth, Sarah is unable to commit to this at this time. We appreciate your consideration and wish you continued success.\n\nBest,\nAlex on behalf of ${clientName}`;
        } else {
          sample = `Hi ${sender},\n\nThank you for your email regarding ${thread.subject}.\n\nWe have received your message and are currently reviewing. We will follow up with full details by tomorrow.\n\nSincerely,\n${clientName}`;
        }
        setReplyDraftText(sample);
      };

      const isClientReply = thread.classification === 'Client to Reply';
      const isAssistantReply = thread.classification === 'Assistant to Reply';

      return (
        <div className="flex-1 flex flex-col h-full overflow-hidden">
          
          {/* Thread Header Bar */}
          <div className="p-4 border-b border-slate-200/80 flex items-center justify-between gap-3 bg-white">
            <div className="truncate flex-1">
              <h2 className="text-sm font-bold text-slate-900 truncate">{thread.subject}</h2>
              <div className="flex items-center gap-2 mt-0.5 text-xs text-slate-500">
                <span>From: <strong className="text-slate-700">{thread.sender.name}</strong></span>
                <span>•</span>
                <span className="text-[11px] font-mono text-slate-400">{thread.sender.email}</span>
              </div>
            </div>

            <div className="flex items-center gap-1.5 shrink-0">
              <button
                onClick={() => onToggleStar(thread.threadId)}
                title={thread.isImportant ? "Starred" : "Star email"}
                className="p-1.5 rounded-lg text-slate-400 hover:text-amber-500 hover:bg-slate-100 transition"
              >
                <Icon name={thread.isImportant ? "star" : "star-outline"} className={`w-4 h-4 ${thread.isImportant ? 'text-amber-400 fill-amber-400' : ''}`} />
              </button>
              <button
                onClick={() => onToggleRead(thread.threadId)}
                title={thread.isRead ? "Mark Unread" : "Mark Read"}
                className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition"
              >
                <Icon name="mail" className="w-4 h-4" />
              </button>
              <button
                onClick={() => onArchive(thread.threadId)}
                title="Archive Thread"
                className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition"
              >
                <Icon name="archive" className="w-4 h-4" />
              </button>
            </div>
          </div>

          {/* Scrollable Conversation Content */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50">
            
            {/* AI INTELLIGENCE CARD (Core Requirement) */}
            <div className="rounded-2xl border border-brand-200/80 bg-gradient-to-br from-brand-50/70 via-white to-purple-50/40 p-4 shadow-subtle">
              
              {/* Responsibility Badge with Manual Override Dropdown */}
              <div className="flex items-center justify-between gap-2 mb-3">
                <div className="flex items-center gap-2">
                  <div className="w-6 h-6 rounded-lg bg-brand-600 text-white flex items-center justify-center">
                    <Icon name="sparkles" className="w-3.5 h-3.5 text-amber-300" />
                  </div>
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-brand-700">AI Reply Classification</span>
                    <div className="flex items-center gap-1.5">
                      <span className={`text-xs font-extrabold ${
                        isClientReply ? 'text-amber-800' : isAssistantReply ? 'text-purple-900' : 'text-slate-700'
                      }`}>
                        {thread.classification}
                      </span>
                      <span className="text-[10px] font-mono px-1.5 py-0.2 rounded bg-white/80 text-brand-800 border border-brand-200">
                        {thread.confidence}% Confidence
                      </span>
                      {thread.isOverridden && (
                        <span className="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.2 rounded bg-amber-100 text-amber-800 border border-amber-300">
                          Overridden
                        </span>
                      )}
                    </div>
                  </div>
                </div>

                {/* MANUAL OVERRIDE SELECTOR */}
                <div className="relative">
                  <button
                    onClick={() => setShowClassDropdown(!showClassDropdown)}
                    className="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-lg bg-white border border-slate-200 hover:border-brand-300 text-slate-700 shadow-subtle transition"
                  >
                    <span>Change</span>
                    <Icon name="chevron-down" className="w-3 h-3 text-slate-400" />
                  </button>

                  {showClassDropdown && (
                    <div className="absolute right-0 mt-1 w-48 bg-white rounded-xl shadow-elevated border border-slate-200 p-1 z-30">
                      <button
                        onClick={() => { onOverrideClassification(thread.threadId, 'Assistant to Reply'); setShowClassDropdown(false); }}
                        className="w-full text-left px-3 py-1.5 text-xs font-medium rounded-lg hover:bg-purple-50 text-purple-900 flex items-center gap-2"
                      >
                        <Icon name="user-check" className="w-3.5 h-3.5 text-purple-600" />
                        <span>Assistant to Reply</span>
                      </button>
                      <button
                        onClick={() => { onOverrideClassification(thread.threadId, 'Client to Reply'); setShowClassDropdown(false); }}
                        className="w-full text-left px-3 py-1.5 text-xs font-medium rounded-lg hover:bg-amber-50 text-amber-900 flex items-center gap-2"
                      >
                        <Icon name="alert-circle" className="w-3.5 h-3.5 text-amber-600" />
                        <span>Client to Reply</span>
                      </button>
                      <button
                        onClick={() => { onOverrideClassification(thread.threadId, 'No Reply Needed'); setShowClassDropdown(false); }}
                        className="w-full text-left px-3 py-1.5 text-xs font-medium rounded-lg hover:bg-slate-50 text-slate-700 flex items-center gap-2"
                      >
                        <Icon name="check-circle" className="w-3.5 h-3.5 text-slate-400" />
                        <span>No Reply Needed</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>

              {/* AI Reasoning Text */}
              <div className="p-2.5 bg-white/90 rounded-xl border border-brand-100/80 mb-3 text-xs text-slate-700 leading-relaxed">
                <span className="font-semibold text-brand-900">Why this was classified: </span>
                <span>{thread.reasoning}</span>
              </div>

              {/* Executive Summary */}
              {thread.summary && (
                <div className="mb-3">
                  <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Executive Summary</p>
                  <p className="text-xs text-slate-800 font-medium leading-relaxed bg-white/60 p-2 rounded-lg border border-slate-100">
                    {thread.summary}
                  </p>
                </div>
              )}

              {/* Key Points & Action Checklist */}
              {thread.actionItems && thread.actionItems.length > 0 && (
                <div>
                  <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Action Items Checklist</p>
                  <div className="space-y-1">
                    {thread.actionItems.map((item, idx) => (
                      <label key={idx} className="flex items-center gap-2 text-xs text-slate-700 bg-white/80 px-2 py-1.5 rounded-lg border border-slate-100 cursor-pointer hover:bg-white transition">
                        <input type="checkbox" defaultChecked={item.completed} className="rounded text-brand-600 focus:ring-brand-500" />
                        <span className="font-medium">{item.task}</span>
                        <span className="ml-auto text-[10px] font-semibold px-1.5 py-0.2 rounded bg-slate-100 text-slate-600">
                          {item.assignee}
                        </span>
                      </label>
                    ))}
                  </div>
                </div>
              )}

              {/* Detected Meeting Banner (if present) */}
              {thread.detectedMeeting && thread.detectedMeeting.hasMeeting && (
                <div className="mt-3 p-3 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2.5">
                    <div className="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center shrink-0">
                      <Icon name="calendar" className="w-4 h-4" />
                    </div>
                    <div>
                      <p className="text-xs font-bold text-emerald-950">{thread.detectedMeeting.title}</p>
                      <p className="text-[11px] text-emerald-700">{thread.detectedMeeting.date} • {thread.detectedMeeting.time} ({thread.detectedMeeting.location})</p>
                    </div>
                  </div>
                  <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-emerald-200 text-emerald-900">Meeting</span>
                </div>
              )}

            </div>

            {/* Conversation Messages */}
            <div className="space-y-3">
              <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-1">Conversation Thread ({thread.messages.length})</p>
              
              {thread.messages.map((msg, idx) => (
                <div
                  key={msg.id || idx}
                  className={`p-3.5 rounded-2xl border ${
                    msg.isFromAssistant
                      ? 'bg-purple-50/80 border-purple-200 ml-6'
                      : msg.isFromClient
                        ? 'bg-slate-900 text-white border-slate-800 ml-6'
                        : 'bg-white border-slate-200/80 mr-6'
                  } shadow-subtle`}
                >
                  <div className="flex items-center justify-between gap-2 mb-2 pb-1.5 border-b border-slate-100">
                    <div className="flex items-center gap-2">
                      <span className={`text-xs font-bold ${msg.isFromClient ? 'text-white' : 'text-slate-800'}`}>
                        {msg.sender}
                      </span>
                      {msg.isFromAssistant && (
                        <span className="text-[10px] font-semibold px-1.5 rounded bg-purple-200 text-purple-900">Assistant</span>
                      )}
                      {msg.isFromClient && (
                        <span className="text-[10px] font-semibold px-1.5 rounded bg-amber-400 text-slate-950 font-bold">Client</span>
                      )}
                    </div>
                    <span className={`text-[10px] ${msg.isFromClient ? 'text-slate-400' : 'text-slate-400'}`}>{msg.timestamp}</span>
                  </div>

                  <p className={`text-xs leading-relaxed whitespace-pre-wrap ${msg.isFromClient ? 'text-slate-200' : 'text-slate-700'}`}>
                    {msg.body}
                  </p>
                </div>
              ))}
            </div>

          </div>

          {/* AI Reply Composer / Approval Gate */}
          <div className="p-3.5 border-t border-slate-200 bg-white">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                  <Icon name="sparkles" className="w-3.5 h-3.5 text-brand-600" />
                  AI Draft Composer
                </span>
                
                {/* Tone Selector */}
                <div className="relative">
                  <button
                    onClick={() => setShowToneDropdown(!showToneDropdown)}
                    className="flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
                  >
                    <span>Tone: <strong className="capitalize">{activeTone}</strong></span>
                    <Icon name="chevron-down" className="w-3 h-3 text-slate-400" />
                  </button>

                  {showToneDropdown && (
                    <div className="absolute left-0 bottom-full mb-1 w-44 bg-white rounded-xl shadow-elevated border border-slate-200 p-1 z-30">
                      {['professional', 'scheduling', 'direct', 'warm', 'decline'].map(t => (
                        <button
                          key={t}
                          onClick={() => handleToneChange(t)}
                          className="w-full text-left px-3 py-1.5 text-xs capitalize rounded-lg hover:bg-brand-50 hover:text-brand-700 transition"
                        >
                          {t}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <span className="text-[11px] text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 font-medium">
                Review & approve before sending
              </span>
            </div>

            <textarea
              rows={3}
              value={replyDraftText}
              onChange={(e) => setReplyDraftText(e.target.value)}
              placeholder="Type your response or review AI generated draft..."
              className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition leading-relaxed resize-none font-sans"
            />

            <div className="flex items-center justify-between mt-2 pt-1">
              <span className="text-[11px] text-slate-400 font-medium">
                Sent as: Alex for {thread.clientName}
              </span>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => handleToneChange(activeTone)}
                  className="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100 transition"
                >
                  Regenerate Draft
                </button>
                <button
                  onClick={() => onSendReply(thread.threadId, replyDraftText)}
                  className="flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-xs font-bold bg-brand-600 text-white shadow-glow-purple hover:bg-brand-700 transition"
                >
                  <Icon name="send" className="w-3.5 h-3.5" />
                  <span>Approve & Send</span>
                </button>
              </div>
            </div>
          </div>

        </div>
      );
    }

    // ==========================================
    // 7. MINIMALISTIC CLIENT PORTAL (Zen View)
    // ==========================================
    function ClientPortal({ emails, activeAccount, onHandled, onDelegate, onSwitchToAssistant }) {
      const [delegatingId, setDelegatingId] = useState(null);
      const [customNote, setCustomNote] = useState('');
      const [viewThreadModal, setViewThreadModal] = useState(null);

      // Filter only emails needing Client attention
      const clientPriorityEmails = emails.filter(e => e.classification === 'Client to Reply' && !e.isCompleted && !e.isArchived);
      const otherEmailsCount = emails.length - clientPriorityEmails.length;

      return (
        <div className="flex-1 flex flex-col max-w-4xl w-full mx-auto px-4 sm:px-6 py-8">
          
          {/* Executive Greeting Header */}
          <div className="mb-8">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-bold uppercase tracking-wider text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200">
                Client Executive Portal
              </span>
              <button
                onClick={onSwitchToAssistant}
                className="text-xs text-slate-500 hover:text-brand-600 font-medium underline"
              >
                Switch to full assistant workspace →
              </button>
            </div>
            
            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
              Good day, {activeAccount.clientName.split(' ')[0]}.
            </h1>
            <p className="text-sm text-slate-600 mt-1">
              {clientPriorityEmails.length > 0 
                ? `You have ${clientPriorityEmails.length} item${clientPriorityEmails.length === 1 ? '' : 's'} requiring your personal decision or input.`
                : "You're completely caught up! No urgent decisions currently require your input."}
            </p>
          </div>

          {/* Assistant Shield Banner */}
          <div className="bg-slate-900 text-white rounded-2xl p-4 sm:p-5 mb-8 shadow-elevated flex items-center justify-between gap-4">
            <div className="flex items-center gap-3.5">
              <div className="w-10 h-10 rounded-xl bg-brand-500/20 border border-brand-400/30 flex items-center justify-center shrink-0">
                <Icon name="shield" className="w-5 h-5 text-brand-300" />
              </div>
              <div>
                <p className="text-xs font-semibold text-slate-200">Executive Shield Active</p>
                <p className="text-xs text-slate-400 mt-0.5">
                  Assistant Alex has triaged and handled <strong>{otherEmailsCount} routine inquiries, scheduling, and notifications</strong> in the background.
                </p>
              </div>
            </div>
          </div>

          {/* CLIENT ACTION CARDS */}
          {clientPriorityEmails.length === 0 ? (
            <div className="bg-white rounded-3xl border border-slate-200 p-12 text-center shadow-subtle flex flex-col items-center">
              <div className="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-4">
                <Icon name="check-circle" className="w-8 h-8" />
              </div>
              <h3 className="text-lg font-bold text-slate-900">Zero Pending Items</h3>
              <p className="text-xs text-slate-500 mt-1 max-w-sm">
                All communications are up to date. You can enjoy focus time while your assistant manages your operational inbox.
              </p>
            </div>
          ) : (
            <div className="space-y-4">
              {clientPriorityEmails.map(thread => (
                <div
                  key={thread.threadId}
                  className="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-subtle hover:shadow-card transition flex flex-col gap-4"
                >
                  {/* Card Header: Sender & Received date */}
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-center gap-3">
                      <img src={thread.sender.avatar} className="w-10 h-10 rounded-full object-cover border border-slate-200" />
                      <div>
                        <h4 className="text-sm font-bold text-slate-900">{thread.sender.name}</h4>
                        <p className="text-xs text-slate-500">{thread.sender.email} • {thread.messages[0]?.timestamp || 'Today'}</p>
                      </div>
                    </div>

                    <span className="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-amber-100 text-amber-900 border border-amber-200">
                      Requires Your Review
                    </span>
                  </div>

                  {/* Subject */}
                  <div>
                    <h3 className="text-base font-bold text-slate-900 mb-1">{thread.subject}</h3>
                    
                    {/* Why Your Response is Needed (AI Highlight) */}
                    <div className="p-3 bg-amber-50/80 border border-amber-200/80 rounded-xl mt-2 text-xs text-amber-950 flex items-start gap-2.5">
                      <Icon name="sparkles" className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                      <div>
                        <span className="font-bold">Why your input is needed: </span>
                        <span>{thread.reasoning}</span>
                      </div>
                    </div>
                  </div>

                  {/* Short Summary Snippet */}
                  <p className="text-xs text-slate-700 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                    {thread.summary}
                  </p>

                  {/* Client Action Buttons */}
                  <div className="pt-2 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3">
                    
                    <button
                      onClick={() => setViewThreadModal(thread)}
                      className="text-xs font-semibold text-slate-600 hover:text-slate-900 underline self-start sm:self-center"
                    >
                      Read full conversation ({thread.messages.length} msg)
                    </button>

                    <div className="flex items-center gap-2 w-full sm:w-auto">
                      
                      {/* Delegate to Assistant Button */}
                      <button
                        onClick={() => setDelegatingId(delegatingId === thread.threadId ? null : thread.threadId)}
                        className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold bg-purple-50 text-purple-800 border border-purple-200 hover:bg-purple-100 transition"
                      >
                        <Icon name="user-check" className="w-3.5 h-3.5" />
                        <span>Hand to Assistant</span>
                      </button>

                      {/* Mark Handled Button */}
                      <button
                        onClick={() => onHandled(thread.threadId)}
                        className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white hover:bg-slate-800 transition shadow-subtle"
                      >
                        <Icon name="check" className="w-3.5 h-3.5 text-emerald-400" />
                        <span>Mark Handled</span>
                      </button>

                    </div>
                  </div>

                  {/* Quick Delegation Instruction Drawer */}
                  {delegatingId === thread.threadId && (
                    <div className="p-3.5 bg-purple-50/90 border border-purple-200 rounded-xl mt-2 animate-fadeIn">
                      <p className="text-xs font-bold text-purple-900 mb-2">Instructions for Assistant Alex:</p>
                      <div className="flex flex-wrap gap-1.5 mb-2.5">
                        {['Please decline politely', 'Schedule 30 mins for next week', 'Request revised redlines', 'I approve, proceed with execution'].map(preset => (
                          <button
                            key={preset}
                            onClick={() => setCustomNote(preset)}
                            className="text-[11px] px-2.5 py-1 rounded-lg bg-white border border-purple-200 hover:bg-purple-100 text-purple-900 font-medium transition"
                          >
                            {preset}
                          </button>
                        ))}
                      </div>

                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={customNote}
                          onChange={(e) => setCustomNote(e.target.value)}
                          placeholder="Or type a custom note for Alex..."
                          className="flex-1 px-3 py-1.5 bg-white border border-purple-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-purple-500"
                        />
                        <button
                          onClick={() => {
                            onDelegate(thread.threadId, customNote);
                            setDelegatingId(null);
                            setCustomNote('');
                          }}
                          className="px-4 py-1.5 bg-purple-700 text-white font-bold text-xs rounded-lg hover:bg-purple-800 transition"
                        >
                          Confirm Handover
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              ))}
            </div>
          )}

          {/* MODAL: Full Conversation Readout for Client */}
          {viewThreadModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
                <div className="p-4 border-b border-slate-100 flex items-center justify-between">
                  <h3 className="text-sm font-bold text-slate-900 truncate">{viewThreadModal.subject}</h3>
                  <button onClick={() => setViewThreadModal(null)} className="text-slate-400 hover:text-slate-700 p-1">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-5 overflow-y-auto space-y-4">
                  {viewThreadModal.messages.map((m, idx) => (
                    <div key={idx} className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                      <div className="flex justify-between items-center mb-1 text-xs">
                        <span className="font-bold text-slate-800">{m.sender}</span>
                        <span className="text-slate-400">{m.timestamp}</span>
                      </div>
                      <p className="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed">{m.body}</p>
                    </div>
                  ))}
                </div>
                <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end">
                  <button
                    onClick={() => setViewThreadModal(null)}
                    className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-semibold"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 8. STATS KPI CARD
    // ==========================================
    function StatCard({ label, value, icon, active, onClick, color = "slate", highlight }) {
      const colorStyles = {
        purple: active ? 'bg-purple-600 text-white shadow-glow-purple border-purple-600' : 'hover:border-purple-200',
        amber: active ? 'bg-amber-500 text-slate-950 shadow-glow-amber border-amber-500' : 'hover:border-amber-200',
        rose: active ? 'bg-rose-600 text-white border-rose-600' : 'hover:border-rose-200',
        blue: active ? 'bg-blue-600 text-white border-blue-600' : 'hover:border-blue-200',
        emerald: active ? 'bg-emerald-600 text-white border-emerald-600' : 'hover:border-emerald-200',
        gray: active ? 'bg-slate-700 text-white border-slate-700' : 'hover:border-slate-300',
        slate: active ? 'bg-slate-900 text-white border-slate-900' : 'hover:border-slate-300'
      };

      return (
        <div
          onClick={onClick}
          className={`p-3 rounded-2xl border transition-all cursor-pointer relative bg-white shadow-subtle ${
            active ? colorStyles[color] : 'border-slate-200/80 hover:bg-slate-50/80'
          }`}
        >
          {highlight && !active && (
            <span className="absolute top-2 right-2 text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.2 rounded bg-amber-100 text-amber-800">
              {highlight}
            </span>
          )}
          <div className="flex items-center gap-2 mb-1">
            <Icon name={icon} className={`w-3.5 h-3.5 ${active ? 'text-inherit' : 'text-slate-400'}`} />
            <p className={`text-[11px] font-semibold truncate ${active ? 'text-inherit' : 'text-slate-500'}`}>
              {label}
            </p>
          </div>
          <p className="text-xl font-extrabold tracking-tight">{value}</p>
        </div>
      );
    }

    // ==========================================
    // 9. NAVIGATION TAB ITEM
    // ==========================================
    function NavTabItem({ label, icon, count, active, onClick, badgeColor = "bg-slate-100 text-slate-700" }) {
      return (
        <button
          onClick={onClick}
          className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold transition ${
            active
              ? 'bg-brand-600 text-white shadow-subtle'
              : 'text-slate-600 hover:bg-slate-100/80 hover:text-slate-900'
          }`}
        >
          <div className="flex items-center gap-2.5">
            <Icon name={icon} className={`w-4 h-4 ${active ? 'text-white' : 'text-slate-400'}`} />
            <span>{label}</span>
          </div>
          {count !== undefined && count > 0 && (
            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${active ? 'bg-white/20 text-white' : badgeColor}`}>
              {count}
            </span>
          )}
        </button>
      );
    }

    // ==========================================
    // 10. UPCOMING MEETINGS WIDGET
    // ==========================================
    function UpcomingMeetingsWidget({ emails, onSelectThread }) {
      const meetingEmails = emails.filter(e => e.detectedMeeting && e.detectedMeeting.hasMeeting);

      return (
        <div className="bg-white rounded-2xl border border-slate-200/80 p-3.5 shadow-subtle">
          <div className="flex items-center justify-between mb-2.5">
            <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <Icon name="calendar" className="w-3.5 h-3.5 text-emerald-600" />
              Detected Meetings
            </span>
            <span className="text-[10px] font-bold px-1.5 py-0.2 rounded bg-emerald-100 text-emerald-800">
              {meetingEmails.length}
            </span>
          </div>

          <div className="space-y-2">
            {meetingEmails.slice(0, 3).map(thread => (
              <div
                key={thread.threadId}
                onClick={() => onSelectThread(thread.threadId)}
                className="p-2 rounded-xl bg-slate-50 hover:bg-brand-50/60 border border-slate-100 transition cursor-pointer"
              >
                <p className="text-xs font-bold text-slate-800 truncate">{thread.detectedMeeting.title}</p>
                <p className="text-[11px] text-emerald-700 font-medium">{thread.detectedMeeting.date} • {thread.detectedMeeting.time}</p>
                <p className="text-[10px] text-slate-400 truncate mt-0.5">{thread.detectedMeeting.location}</p>
              </div>
            ))}

    // ==========================================
    // 12. ONBOARDING & EMAIL CONNECTION MODAL
    // ==========================================
    function OnboardingModal({ onClose, onAccountConnected }) {
      const [step, setStep] = useState(1); // 1: Choose provider, 2: Simulated Auth, 3: Syncing
      const [provider, setProvider] = useState('google');
      const [emailInput, setEmailInput] = useState('');
      const [syncProgress, setSyncProgress] = useState(0);

      const startConnection = (selectedProvider) => {
        setProvider(selectedProvider);
        setEmailInput(selectedProvider === 'google' ? 'sarah.founder@gmail.com' : 's.jenkins@outlook.com');
        setStep(2);
      };

      const authorizeAndSync = () => {
        setStep(3);
        let progress = 0;
        const interval = setInterval(() => {
          progress += 25;
          setSyncProgress(progress);
          if (progress >= 100) {
            clearInterval(interval);
            setTimeout(() => {
              onAccountConnected({
                id: `acc-${Date.now()}`,
                provider,
                email: emailInput,
                name: `${provider === 'google' ? 'Google Workspace' : 'Microsoft 365'} (${emailInput})`,
                clientName: 'Sarah Jenkins',
                clientTitle: 'Executive Account',
                avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80',
                syncStatus: 'active',
                lastSynced: 'Just now',
                totalThreads: 6
              });
            }, 400);
          }
        }, 350);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
            
            {step === 1 && (
              <div>
                <h3 className="text-lg font-extrabold text-slate-900 mb-1">Connect Email Account</h3>
                <p className="text-xs text-slate-500 mb-5">Select your client's email provider to authorize Maya AI.</p>

                <div className="space-y-3 mb-6">
                  <button
                    onClick={() => startConnection('google')}
                    className="w-full flex items-center justify-between p-3.5 rounded-2xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 transition group"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-lg bg-red-50 text-red-600 flex items-center justify-center font-bold text-xs">
                        G
                      </div>
                      <div className="text-left">
                        <p className="text-xs font-bold text-slate-800 group-hover:text-brand-900">Google Workspace / Gmail</p>
                        <p className="text-[11px] text-slate-400">OAuth2.0 Secure Sync</p>
                      </div>
                    </div>
                    <Icon name="check" className="w-4 h-4 text-slate-300 group-hover:text-brand-600" />
                  </button>

                  <button
                    onClick={() => startConnection('microsoft')}
                    className="w-full flex items-center justify-between p-3.5 rounded-2xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 transition group"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-xs">
                        M
                      </div>
                      <div className="text-left">
                        <p className="text-xs font-bold text-slate-800 group-hover:text-brand-900">Microsoft Outlook / 365</p>
                        <p className="text-[11px] text-slate-400">Microsoft Graph Integration</p>
                      </div>
                    </div>
                    <Icon name="check" className="w-4 h-4 text-slate-300 group-hover:text-brand-600" />
                  </button>
                </div>

                <div className="flex justify-end">
                  <button onClick={onClose} className="px-4 py-2 text-xs font-semibold text-slate-500 hover:bg-slate-100 rounded-xl">
                    Cancel
                  </button>
                </div>
              </div>
            )}

            {step === 2 && (
              <div>
                <div className="w-12 h-12 rounded-2xl bg-brand-100 text-brand-700 flex items-center justify-center mb-4">
                  <Icon name="shield" className="w-6 h-6" />
                </div>
                <h3 className="text-base font-bold text-slate-900 mb-1">Grant Maya AI Permissions</h3>
                <p className="text-xs text-slate-500 mb-4">Connecting as <strong className="text-slate-800">{emailInput}</strong></p>

                <div className="space-y-2 mb-6 bg-slate-50 p-3.5 rounded-2xl border border-slate-100 text-xs text-slate-600">
                  <div className="flex items-center gap-2">
                    <Icon name="check" className="w-4 h-4 text-emerald-600" />
                    <span>Read email threads to classify responsibility</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <Icon name="check" className="w-4 h-4 text-emerald-600" />
                    <span>Draft responses with mandatory assistant approval</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <Icon name="check" className="w-4 h-4 text-emerald-600" />
                    <span>Detect calendar appointments and deadlines</span>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2">
                  <button onClick={() => setStep(1)} className="px-4 py-2 text-xs font-semibold text-slate-500">Back</button>
                  <button
                    onClick={authorizeAndSync}
                    className="px-5 py-2.5 bg-brand-600 text-white rounded-xl text-xs font-bold shadow-glow-purple hover:bg-brand-700 transition"
                  >
                    Authorize & Synchronize

                </div>
              </div>
            )}

            {step === 3 && (
              <div className="text-center py-4">
                <div className="w-12 h-12 rounded-full border-4 border-brand-200 border-t-brand-600 animate-spin mx-auto mb-4"></div>
                <h3 className="text-sm font-bold text-slate-900 mb-1">Synchronizing Inbox...</h3>
                <p className="text-xs text-slate-500 mb-4">Applying Maya AI responsibility classification engine</p>
                <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden mb-2">
                  <div className="bg-brand-600 h-full transition-all duration-300" style={{ width: `${syncProgress}%` }}></div>
                </div>
                <span className="text-[11px] font-mono text-slate-400">{syncProgress}% Complete</span>

          </div>
        </div>
      );
    }

    // ==========================================
    // 13. AI COPILOT CHAT DRAWER ("Ask Maya AI")
    // ==========================================
    function AICopilotDrawer({ onClose, emails, onOpenThread }) {
      const [messages, setMessages] = useState([
        {
          id: 'welcome',
          isUser: false,
          text: "Hi Alex! I'm your Maya AI Executive Copilot. Ask me anything about Sarah's inbox—such as pending approvals, who needs to reply, or request drafted replies."
        }
      ]);
      const [input, setInput] = useState('');

      const handleAsk = (queryText) => {
        const q = queryText || input;
        if (!q.trim()) return;

        const userMsg = { id: `u-${Date.now()}`, isUser: true, text: q };
        setMessages(prev => [...prev, userMsg]);
        setInput('');

        setTimeout(() => {
          const lq = q.toLowerCase();
          let replyText = '';
          let actionId = null;

          if (lq.includes('need my attention') || lq.includes('client attention') || lq.includes('attention')) {
            const clientItems = emails.filter(e => e.classification === 'Client to Reply' && !e.isCompleted);
            replyText = `There are **${clientItems.length} emails** requiring Sarah’s personal attention:\n\n` +
              clientItems.map(i => `• **${i.sender.name}**: "${i.subject}"\n  _Reason: ${i.reasoning}_`).join('\n\n');
            actionId = clientItems[0]?.threadId;
          } else if (lq.includes('waiting') || lq.includes('pending response')) {
            const waitingItems = emails.filter(e => e.waitingForResponse);
            replyText = `You are waiting on **${waitingItems.length} conversations**:\n\n` +
              waitingItems.map(i => `• **${i.sender.name}**: "${i.subject}" (Sent follow-up yesterday)`).join('\n');
            actionId = waitingItems[0]?.threadId;
          } else if (lq.includes('summarize')) {
            const sample = emails[0];
            replyText = `**Executive Summary for "${sample.subject}"**:\n\n${sample.summary}\n\n**Key Points:**\n${sample.keyPoints.map(p => `• ${p}`).join('\n')}`;
            actionId = sample.threadId;
          } else if (lq.includes('why') && lq.includes('client')) {
            const clientSample = emails.find(e => e.classification === 'Client to Reply') || emails[0];
            replyText = `**"${clientSample.subject}"** was classified as **Client to Reply** (${clientSample.confidence}% confidence) because:\n\n> ${clientSample.reasoning}\n\nHigh-stakes governance, equity, or personal decisions are automatically escalated to the client.`;
            actionId = clientSample.threadId;
          } else {
            replyText = `Here is the current inbox summary for Sarah Jenkins:\n\n• **${emails.filter(e => e.classification === 'Assistant to Reply').length}** tasks assigned to you (Assistant to Reply)\n• **${emails.filter(e => e.classification === 'Client to Reply').length}** items requiring Sarah's approval\n• **${emails.filter(e => e.detectedMeeting?.hasMeeting).length}** calendar sync requests detected`;
          }

          setMessages(prev => [...prev, {
            id: `ai-${Date.now()}`,
            isUser: false,
            text: replyText,
            actionId
          }]);
        }, 500);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex justify-end">
          <div className="bg-white w-full max-w-md h-full shadow-2xl flex flex-col border-l border-slate-200 animate-slideLeft">
            
            {/* Header */}
            <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-600 text-white flex items-center justify-center">
                  <Icon name="sparkles" className="w-4 h-4 text-amber-300" />
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-900">Maya AI Copilot</h3>
                  <p className="text-[11px] text-slate-500">Natural language inbox intelligence</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Quick Prompt Chips */}
            <div className="p-3 border-b border-slate-100 bg-white flex gap-1.5 overflow-x-auto text-xs">
              <button
                onClick={() => handleAsk("Show me emails that need my attention")}
                className="whitespace-nowrap px-2.5 py-1 rounded-lg bg-brand-50 text-brand-700 hover:bg-brand-100 font-medium transition"
              >
                Needs Attention
              </button>
              <button
                onClick={() => handleAsk("What am I waiting for a response on?")}
                className="whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 font-medium transition"
              >
                Waiting On
              </button>
              <button
                onClick={() => handleAsk("Why has this email been assigned to the client?")}
                className="whitespace-nowrap px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 hover:bg-amber-100 font-medium transition"
              >
                Why Client?
              </button>
            </div>

            {/* Chat Messages */}
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {messages.map(m => (
                <div key={m.id} className={`flex flex-col ${m.isUser ? 'items-end' : 'items-start'}`}>
                  <div
                    className={`p-3 rounded-2xl max-w-[88%] text-xs leading-relaxed whitespace-pre-wrap ${
                      m.isUser
                        ? 'bg-brand-600 text-white rounded-tr-none'
                        : 'bg-slate-100 text-slate-800 rounded-tl-none border border-slate-200/60'
                    }`}
                  >
                    {m.text}
                  </div>
                  {m.actionId && (
                    <button
                      onClick={() => onOpenThread(m.actionId)}
                      className="mt-1 text-[11px] text-brand-600 hover:underline font-semibold"
                    >
                      Inspect thread →
                    </button>
                  )}
                </div>
              ))}
            </div>

            {/* Input Bar */}
            <div className="p-3 border-t border-slate-100 bg-white flex gap-2">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleAsk()}
                placeholder="Ask Maya about emails, schedule, replies..."
                className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20"
              />
              <button
                onClick={() => handleAsk()}
                className="px-3.5 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold hover:bg-brand-700 transition"
              >
                <Icon name="send" className="w-3.5 h-3.5" />
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Mount the Application
    ReactDOM.createRoot(document.getElementById('root')).render(<MayaApp />);
  </script>
